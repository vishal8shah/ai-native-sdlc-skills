name: Reproducible bug
description: Report a helper or skill failure using synthetic inputs.
title: '[Bug] '
labels: []
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command or prompt, synthetic input, version and environment.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed versus expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive output and limitations
      description: Do not include credentials, customer data or internal records.
